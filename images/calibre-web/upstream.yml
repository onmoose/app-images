# Calibre-Web: a web app to browse, read and download the books in a Calibre
# library. Upstream publishes no current image (its Docker Hub repo was last
# pushed in 2017) and has no Dockerfile. Its README sends Docker users to the
# linuxserver.io image, whose s6-overlay start needs root. So this folder
# holds our own Dockerfile, which runs calibre-web directly as a non-root uid.
#
# What the image includes and leaves out:
# - In: the core requirements, and the optional groups metadata, comics and
#   kobo from upstream's pyproject.toml. ImageMagick and Ghostscript for
#   covers.
# - Out: Calibre's ebook-convert. Book conversion between formats needs the
#   full Calibre desktop program, several hundred MB. The linuxserver.io
#   image leaves it out by default too. Reading, downloading, uploading and
#   metadata editing work without it.
# - Out: kepubify, so Kobo sync sends plain EPUB, not KEPUB.
# - Out: unrar, so CBR comics do not open (CBZ and CB7 do). Debian ships
#   unrar only in non-free.
# - Out: the gdrive, gmail, goodreads, ldap and oauth groups. Each needs an
#   outside service a home box does not have.
#
# 0.6.27 is a lightweight tag, so `commit:` is the commit the tag names.
repo: janeczku/calibre-web
ref_type: tag
ref: 0.6.27
commit: c3756a903e7d91b2ab7e12c1b5ff818a61cc1e16
revision: 1
