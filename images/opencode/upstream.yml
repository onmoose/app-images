# OpenCode, an open-source AI coding agent. It serves its own web UI, so this
# image runs OpenCode's server instead of the moose-terminal project page: a
# terminal app with a good official UI uses that UI (onmoose/os
# docs/specs/TERMINAL_APPS.md # Options considered).
#
# The base is still right. Upstream's own image is the CLI alone on Alpine, with
# no git and no language runtime, and an agent needs both to work on a project.
# moose-terminal brings git, gh, Node, Python, ripgrep and mise, which is what
# makes the app usable inside the sandbox.
#
# OpenCode 2.x always asks for a server password. moose already puts the app
# behind the box login, so start.sh runs OpenCode on 127.0.0.1:4097 with a
# random password, and proxy.js serves port 4096 and adds the password to every
# request (see both files).
#
# MIT, so the binary is in the image and a box never downloads it. 2.x is the
# npm package @opencode/cli, with the same version numbers as the GitHub
# releases, so Renovate follows its releases here. The old package, opencode-ai,
# holds only 1.x.
npm: "@opencode/cli"
version: 2.3.0
revision: 1
license: MIT
probe:
  port: 4096
  # /api/session answers JSON only with the password, and every page path
  # answers 200 with the HTML shell, so a bare status code proves little.
  # start.sh asks /api/session through the proxy with no password, and prints
  # this line only when that worked. So the line proves that both processes run
  # and that the proxy adds the password.
  path: /api/session
  log: "the API answers through the proxy"
  # HOME is /moose, not the base's /home/moose. OpenCode's folder picker starts
  # in HOME, and moose mounts the folders at /moose/projects and
  # /moose/extra/<Name>, so HOME has to be the directory that holds them. The
  # Dockerfile sets the same value; here it stands in for the data bind.
  env:
    HOME: /moose
  tmpfs: [/tmp]
  data: [/moose]
  timeout: 90
