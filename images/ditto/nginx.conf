# Serves Ditto's built files. The app routes in the browser, so any path that
# is not a file falls back to index.html (upstream's _redirects does the same).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output never changes under the same name, so cache it hard.
    # A missing file here is a real 404: falling back to index.html would make
    # a stale tab run HTML as a script.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell, the service worker and the manifest are not hashed. The browser
    # must re-check them, or a new release would never reach a returning visitor.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
