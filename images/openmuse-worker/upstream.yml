# OpenMuse's browser worker: a token-protected Playwright/Chromium service the API drives.
# Upstream's own Dockerfile, unchanged.
repo: CopilotKit/OpenMuse
ref_type: branch
ref: main
commit: a4944f4c471d3dc93b8bfc060b5da309b5216ab2
revision: 1
license: MIT
context: apps/worker
dockerfile: apps/worker/Dockerfile
probe:
  port: 8790
  path: /health
  env:
    WORKER_TOKEN: probe-only-token-0123456789abcdef0123
  tmpfs: [/tmp]
  data: [/data]
