# Serves the web client and sends /api/ to the API service, so both share one origin.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Resolve the API at request time, not at start, so nginx starts even when the
    # API is not up yet. 127.0.0.11 is Docker's own DNS on a compose network.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://server:8787;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Agent replies stream; buffering would hold them until the end.
        proxy_buffering off;
        proxy_read_timeout 1h;
        # The API accepts up to 12 MB (hono bodyLimit).
        client_max_body_size 13m;
    }

    location / {
        try_files $uri $uri.html /index.html;
    }
}
