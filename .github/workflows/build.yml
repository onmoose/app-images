name: build

# Pull requests build and probe. A merge to main builds, probes, and publishes.
# Only the publish job can write packages, and only on main.
on:
  pull_request:
    paths: ["images/**", "tools/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["images/**", "tools/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      image:
        description: "An image folder name, or 'all'. Tags that already exist are skipped."
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.image }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$INPUT" = all ]; then m=$(python3 tools/plan.py --all); else m=$(python3 tools/plan.py --only "$INPUT"); fi
          else
            m=$(python3 tools/plan.py "$BASE" "$HEAD")
          fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "plan: $m"

  build:
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - run: python3 tools/build.py "${{ matrix.image }}" --check-tag --if-exists "${{ matrix.if_exists }}" --cache gha

  publish:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign signs with the workflow's own identity
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: publish ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Upstream code runs in BuildKit's RUN steps, which cannot read this login.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        run: python3 tools/build.py "${{ matrix.image }}" --push --if-exists "${{ matrix.if_exists }}" --cache gha
      - if: steps.push.outputs.ref != ''
        run: cosign sign --yes "${{ steps.push.outputs.ref }}"
